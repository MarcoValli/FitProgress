# Impronta dello script nella CSP di index.html: se uno push cambia lo script senza aggiornarla,
# la ricalcola e la rimette nel ramo con un commit. Su main poi chiede di ripubblicare GitHub Pages,
# perché i commit fatti da questa Action non fanno ripartire la pubblicazione da soli.
name: Impronta CSP

on:
  push:
    paths:
      - index.html
      - tools/csp-hash.mjs

permissions:
  contents: write
  pages: write

concurrency:
  group: csp-hash-${{ github.ref }}
  cancel-in-progress: false

jobs:
  hash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Ricalcola l'impronta
        run: node tools/csp-hash.mjs
      - name: Rimetti l'impronta nel ramo
        id: commit
        run: |
          if git diff --quiet -- index.html; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Aggiorna l'impronta dello script nella CSP" -- index.html
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Ripubblica GitHub Pages
        if: steps.commit.outputs.changed == 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
