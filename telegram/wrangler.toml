# Bot Telegram di FitProgress: vedi README.md in questa cartella
name = "fitprogress-bot"
main = "src/worker.js"
compatibility_date = "2026-09-01"
workers_dev = true

# La pagina (index.html e vendor/), copiata da npm run build
[assets]
directory = "./public"

[[d1_databases]]
binding = "DB"
database_name = "fitprogress"
database_id = "88b853b6-37f5-4f27-9fda-d40b473da3bf" # da: npx wrangler d1 create fitprogress

# Promemoria: ogni ora si mandano quelli in scadenza
[triggers]
crons = ["0 * * * *"]

[vars]
TIME_ZONE = "Europe/Rome"

# Secret (non qui, con npx wrangler secret put NOME):
#   BOT_TOKEN       il token di BotFather
#   WEBHOOK_SECRET  codice a caso (openssl rand -hex 32): solo Telegram lo conosce
#   MASTER_KEY      chiave principale, 64 cifre esadecimali (openssl rand -hex 32): da conservare, senza non si
#                   riapre più nessun file dei progressi
#   ALLOWED_IDS     ID Telegram ammessi, separati da virgole, oppure * per tutti. Vuoto: nessuno (a /start il bot
#                   dice l'ID). È un secret perché così non sta nel repository e non cambia a ogni deploy
